site_name: TeXedores  
site_url: https://prosell-im.github.io/Sitio-TeXedores/
theme:
  name: material
  custom_dir: docs/overrides
  language: es
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.tabs
extra_css:
 - stylesheets/extra.css
 - stylesheets/media.css
nav:
 - Inicio: index.md
 - Nuestras publicaciones: colecciones.md 
 - Búsqueda avanzada: explorar.md
 - Acerca de: acerca.md
 - Publicar en el IM: publicar.md
 - Contacto: contacto.md
markdown_extensions:
 - admonition
 - pymdownx.details
 - pymdownx.superfences
extra_javascript:
 - js/config.js

